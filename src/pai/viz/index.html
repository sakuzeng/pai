<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pai 架构总览</title>
<style>
  :root {
    --bg:#111318; --panel:#1a1d24; --card:#22262f; --line:#3a4150;
    --text:#d8dce6; --dim:#8a93a6; --ok:#4ade80; --partial:#facc15;
    --todo:#5b6372; --err:#f87171; --accent:#818cf8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px;
           border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
  h1 { font-size:16px; margin:0; }
  #meta { color:var(--dim); font-size:12px; margin-left:auto; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:6px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .banner { margin:12px 22px 0; padding:10px 14px; border-radius:8px;
            display:none; white-space:pre-wrap; font-size:13px; }
  #error { background:#3b1d1d; border:1px solid var(--err); color:#fecaca; }
  #warn  { background:#3b331d; border:1px solid var(--partial); color:#fde68a; }
  section { padding:16px 22px 34px; }
  h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; }
  /* —— 结构图 —— */
  #pipeline { position:relative; display:flex; gap:72px; align-items:flex-start;
              overflow-x:auto; padding:8px 2px; }
  #wires { position:absolute; inset:0; pointer-events:none; }
  /* SVG 呈现属性(setAttribute('stroke', 'var(--line)'))不会解析 CSS 自定义属性——
     浏览器直接把 var(...) 当无效值丢弃,stroke 退化成 none,连线完全不可见。
     必须用 CSS 规则驱动样式,JS 只管 d 和 dashed 类名。 */
  #wires path { stroke:var(--line); stroke-width:1.5; fill:none; }
  #wires path.dashed { stroke-dasharray:5 4; }
  .col { display:flex; flex-direction:column; gap:14px; min-width:200px;
         position:relative; z-index:1; }
  .node { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; }
  .node .t { font-weight:600; font-size:13px; }
  .node .d { color:var(--dim); font-size:12px; margin-top:2px; }
  .node.ok      { border-left:3px solid var(--ok); }
  .node.partial { border-left:3px solid var(--partial); }
  .node.todo    { border:1px dashed var(--todo); color:var(--dim); background:transparent; }
  .node.todo .t::after { content:" · 未开始"; font-weight:400; font-size:11px; color:var(--todo); }
  .node.partial .t::after { content:" · 部分"; font-weight:400; font-size:11px; color:var(--partial); }
  /* 未识别的状态词(STATUS.md 格式漂移):不能长得和 .node.ok 一样,否则误导「已完成」 */
  .node.unknown { border-left:3px solid var(--err); opacity:.6; }
  .node.unknown .t::after { content:" · 未知状态"; font-weight:400; font-size:11px; color:var(--err); }
  /* tools 节点内的工具卡 */
  .tool { border:1px solid var(--line); border-radius:8px; padding:8px 10px;
          margin-top:8px; cursor:pointer; background:var(--panel); }
  .tool .name { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--accent); }
  .tool .desc { color:var(--dim); font-size:12px; }
  .tool table { display:none; width:100%; margin-top:6px; border-collapse:collapse; font-size:12px; }
  .tool.open table { display:table; }
  .tool td { padding:2px 6px 2px 0; color:var(--dim); vertical-align:top; }
  .tool td.pn { font-family:ui-monospace,Menlo,monospace; color:var(--text); }
  .req { color:var(--partial); }
  /* —— 代码位置角标（feature 17）—— */
  .src { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--dim);
         cursor:pointer; margin-top:4px; display:inline-block; }
  .src:hover { color:var(--accent); text-decoration:underline; }
  /* —— 点亮（feature 17）。SVG 呈现属性不认 var()，所以点亮一律走 CSS 类 —— */
  .node.hot { box-shadow:0 0 0 2px var(--accent); transition:box-shadow .12s; }
  #wires path.live { stroke:var(--accent); stroke-width:2.5; }
  .live-dot { width:7px; height:7px; border-radius:99px; background:var(--ok);
              display:inline-block; margin-right:6px; animation:pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  /* —— 回合时间线 —— */
  #tl-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  select { background:var(--card); color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:5px 8px; font-size:12px; max-width:340px; }
  label.sw { color:var(--dim); font-size:12px; cursor:pointer; user-select:none; }
  .turn { background:var(--card); border:1px solid var(--line); border-radius:10px;
          margin-bottom:10px; overflow:hidden; }
  .turn.unfinished { border-color:var(--err); }
  .turn > .head { padding:10px 12px; cursor:pointer; display:flex; gap:10px; align-items:baseline; }
  .turn > .head:hover { background:var(--panel); }
  .turn .q { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .turn .num { color:var(--dim); font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  .turn .stat { color:var(--dim); font-size:12px; white-space:nowrap; }
  .turn .flag { color:var(--err); font-size:12px; }
  .turn .body { display:none; padding:0 12px 10px; }
  .turn.open .body { display:block; }
  .divider { display:flex; align-items:center; gap:10px; color:var(--partial);
             font-size:12px; margin:14px 0 10px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--partial); opacity:.4; }
  .step { border-left:2px solid var(--line); padding:6px 0 6px 10px; margin-left:4px; }
  .step .k { font-size:11px; color:var(--dim); font-family:ui-monospace,Menlo,monospace; }
  .step.llm  { border-left-color:var(--accent); }
  .step.tool { border-left-color:var(--ok); }
  .step.event{ border-left-color:var(--partial); }
  .step .name { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .step pre { margin:4px 0 0; padding:6px 8px; background:var(--panel); border-radius:6px;
              font-size:12px; white-space:pre-wrap; word-break:break-all;
              max-height:190px; overflow:auto; color:var(--dim); }
  .step .pending { color:var(--err); font-size:12px; }
  /* —— 阶段路线图 —— */
  #stages { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .stage { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stage .top { display:flex; align-items:center; gap:8px; }
  .stage .label { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .stage .badge { font-size:11px; border-radius:99px; padding:1px 9px; margin-left:auto; }
  .stage.ok      .badge { background:#14321f; color:var(--ok); }
  .stage.partial .badge { background:#332c11; color:var(--partial); }
  .stage.todo    .badge { background:#242a35; color:var(--dim); }
  .stage.unknown .badge { background:#242a35; color:var(--dim); }
  .stage.todo { border-style:dashed; }
  .stage .note { color:var(--dim); font-size:12px; margin-top:6px; }
</style>

<header>
  <h1>pai 架构总览</h1>
  <span id="meta"></span>
  <button id="refresh">刷新</button>
</header>
<div id="error" class="banner"></div>
<div id="warn" class="banner"></div>
<section>
  <h2>运行时结构 <span id="arch-status"></span></h2>
  <div id="pipeline"><svg id="wires"></svg></div>
</section>
<section>
  <h2>回合时间线</h2>
  <div id="tl-head">
    <select id="sessions"></select>
    <label class="sw"><input type="checkbox" id="live" checked> 实时（2s 轮询）</label>
    <span id="tl-meta"></span>
  </div>
  <div id="timeline"></div>
</section>
<section>
  <h2>阶段路线图(来自 docs/dev/STATUS.md)</h2>
  <div id="stages"></div>
</section>

<script>
const $ = id => document.getElementById(id);
let lastData = null;
let lastEls = null;

async function load() {
  $('error').style.display = 'none';
  $('warn').style.display = 'none';  // 上一次刷新留下的警告条不该跨刷新残留
  try {
    const r = await fetch('/api/structure');
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    lastData = data;
    render(data);
    $('meta').textContent = '最后刷新 ' + new Date().toLocaleTimeString()
      + ' · ' + data.model + ' · 工具 ' + data.tools.length + ' 个';
  } catch (e) {
    $('error').textContent = '收集失败:\n' + e.message;
    $('error').style.display = 'block';
  }
}

function statusOf(data, key) {
  const s = (data.stages || []).find(x => x.key === key);
  return s ? s.status : null;
}

function render(data) {
  const warn = $('warn');
  warn.style.display = (data.warnings || []).length ? 'block' : 'none';
  warn.textContent = (data.warnings || []).join('\n');
  renderPipeline(data);
  renderStages(data.stages || []);
}

function renderPipeline(data) {
  const P = $('pipeline');
  P.querySelectorAll('.col').forEach(e => e.remove());
  const maxCol = Math.max(...data.pipeline.nodes.map(n => n.col));
  const cols = [];
  for (let i = 0; i <= maxCol; i++) {
    const c = document.createElement('div');
    c.className = 'col';
    P.appendChild(c); cols.push(c);
  }
  const els = {};
  for (const n of data.pipeline.nodes) {
    const el = document.createElement('div');
    el.className = 'node';
    const st = n.stage ? statusOf(data, n.stage) : null;
    if (st) el.classList.add(st);
    el.dataset.node = n.id;          // 点亮动画按它找节点（STAGE 映射引用的就是这些 id）
    el.innerHTML = '<div class="t"></div>' + (n.desc ? '<div class="d"></div>' : '');
    el.querySelector('.t').textContent = n.label;
    if (n.desc) el.querySelector('.d').textContent = n.desc;
    if (n.src) {
      const tag = document.createElement('span');
      tag.className = 'src';
      tag.dataset.src = n.src;
      tag.textContent = n.src;
      el.appendChild(tag);
    }
    if (n.id === 'tools') for (const t of data.tools) el.appendChild(toolCard(t));
    cols[n.col].appendChild(el);
    els[n.id] = el;
  }
  lastEls = els;
  requestAnimationFrame(() => drawWires(data, els));
}

function toolCard(t) {
  const el = document.createElement('div');
  el.className = 'tool';
  el.innerHTML = '<div class="name"></div><div class="desc"></div><table></table>';
  el.querySelector('.name').textContent = t.name;
  el.querySelector('.desc').textContent = t.description;
  if (t.src) {                       // 自省来的 file:line（collect.py 的 _source_of）
    const tag = document.createElement('span');
    tag.className = 'src';
    tag.dataset.src = t.src;
    tag.textContent = t.src;
    el.appendChild(tag);
  }
  const tb = el.querySelector('table');
  for (const p of t.params) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="pn"></td><td></td><td></td>';
    tr.children[0].textContent = p.name + (p.required ? ' *' : '');
    if (p.required) tr.children[0].classList.add('req');
    tr.children[1].textContent = p.type;
    tr.children[2].textContent = p.desc;
    tb.appendChild(tr);
  }
  el.addEventListener('click', (e) => {
    if (e.target.closest('table')) return;  // 展开态下点参数表不应折叠卡片
    el.classList.toggle('open');
  });
  return el;
}

function drawWires(data, els) {
  const P = $('pipeline'), svg = $('wires');
  svg.setAttribute('width', P.scrollWidth);
  svg.setAttribute('height', P.scrollHeight);
  svg.innerHTML = '';
  const pr = P.getBoundingClientRect();
  const todoIds = new Set(data.pipeline.nodes
    .filter(n => n.stage && statusOf(data, n.stage) === 'todo').map(n => n.id));
  for (const [a, b] of data.pipeline.edges) {
    if (!els[a] || !els[b]) continue;
    const ra = els[a].getBoundingClientRect(), rb = els[b].getBoundingClientRect();
    let d;
    if (Math.abs(ra.left - rb.left) < 20) {   // 同列:上下相连
      const upper = ra.top < rb.top ? ra : rb, lower = ra.top < rb.top ? rb : ra;
      const x = upper.left - pr.left + P.scrollLeft + upper.width / 2;
      d = `M ${x} ${upper.bottom - pr.top} L ${x} ${lower.top - pr.top}`;
    } else {                                   // 跨列:右缘 → 左缘,贝塞尔
      const src = ra.left < rb.left ? ra : rb, dst = ra.left < rb.left ? rb : ra;
      const x1 = src.right - pr.left + P.scrollLeft, y1 = src.top - pr.top + src.height / 2;
      const x2 = dst.left - pr.left + P.scrollLeft,  y2 = dst.top - pr.top + dst.height / 2;
      const mx = (x1 + x2) / 2;
      d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    // stroke/fill 交给 #wires path 的 CSS 规则(见 <style>);presentation attribute
    // 里的 var() 不会被解析,只有 class 触发的 CSS 规则才行
    if (todoIds.has(a) || todoIds.has(b)) path.classList.add('dashed');
    svg.appendChild(path);
  }
}

function renderStages(stages) {
  const S = $('stages');
  S.innerHTML = '';
  for (const st of stages) {
    const el = document.createElement('div');
    el.className = 'stage ' + st.status;
    el.innerHTML = '<div class="top"><span class="label"></span><span class="badge"></span></div>'
                 + '<div class="note"></div>';
    el.querySelector('.label').textContent = st.label;
    el.querySelector('.badge').textContent =
      ({ok: '可用', partial: '部分', todo: '未开始'})[st.status] || st.status;
    el.querySelector('.note').textContent = st.note;
    S.appendChild(el);
  }
}

$('refresh').addEventListener('click', load);
window.addEventListener('resize', () => { if (lastData && lastEls) drawWires(lastData, lastEls); });
load();

/* ============ feature 17：运行时流转 ============
   两条独立的环，**刻意解耦**：
     慢环 /api/flow   → 时间线（事实）
     快环 /api/events → 点亮队列（氛围）
   动画丢帧（页面开晚了、队列截断）不影响时间线的正确性。
   turn 分组只在 Python 一处（viz/flow.py），这里绝不重新实现一遍。 */

// 事件类型 → 该点亮的节点。id 必须与 collect.py 的 _PIPELINE_NODES 对得上，
// 对不上时动画只是静默不亮（waku 承认的盲区）——所以有测试钉住 id 存在性。
const STAGE = {
  AgentStart:         ['task', 'loop'],
  TurnStart:          ['loop'],
  AssistantMessage:   ['llm'],
  ToolStart:          ['tools'],
  ToolEnd:            ['tools'],
  PermissionDecided:  ['permissions'],
  Compacted:          ['compaction'],
  CompactionSkipped:  ['compaction'],
  BreakerTripped:     ['compaction'],
  MemoryWritten:      ['memory'],
  RecallInjected:     ['memory'],
  RecallFailed:       ['memory'],
  AgentEnd:           ['reply', 'session'],
  usage:              ['llm', 'session'],
  assistant:          ['llm', 'session'],
  tool:               ['tools', 'session'],
  user:               ['task', 'session'],
};

let cursor = null, currentSession = '', animQueue = [], playing = false;
const expanded = new Set();      // 展开态跨刷新保留——否则每 2s 自己合上

const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const fmt = n => (n || 0).toLocaleString();

function srcTag(src) {
  if (!src) return '';
  return `<span class="src" data-src="${esc(src)}">${esc(src)}</span>`;
}

// 事件对象 → 一行人话。字段各不相同，所以按类型挑，挑不到就退回 JSON。
function eventLine(name, e) {
  switch (name) {
    case 'PermissionDecided': return `${e.name} → ${e.kind}${e.reason ? '（' + e.reason + '）' : ''}`;
    case 'Compacted':         return `切于 ${e.cut}，估算 ${fmt(e.before)} → ${fmt(e.after)}`;
    case 'CompactionSkipped': return `${e.reason}（估算 ${fmt(e.estimated)}）`;
    case 'BreakerTripped':    return `连续失败 ${e.failures} 次，自动压缩已熔断`;
    case 'RecallInjected':    return `注入 ${(e.names || []).length} 篇：${(e.names || []).join('、')}`;
    case 'RecallFailed':      return `${e.reason}：${e.detail}${e.disabled ? '（已停用）' : ''}`;
    case 'MemoryWritten':     return `${e.topic} → ${e.path}`;
    case 'Interrupted':       return `掐在 ${e.where}`;
    case 'AgentEnd':          return `结束（${e.reason}）`;
    case 'AgentStart':        return e.task || '';
    case 'ToolStart': case 'ToolEnd': return e.name || '';
    default: return '';
  }
}

function stepHTML(s, eventSrc) {
  if (s.kind === 'llm') {
    const cache = s.in ? Math.round((s.cached || 0) / s.in * 100) : 0;
    const calls = (s.tool_calls || []).map(c =>
      `<div class="k">↳ ${esc(c.name)}(${esc(JSON.stringify(c.args))})`
      + (c.pending ? ' <span class="pending">· 结果没回来</span>' : '') + '</div>').join('');
    return `<div class="step llm">
      <span class="k">step ${s.step == null ? '?' : s.step} · LLM</span>
      <span class="name">${esc(s.model || '')}</span>
      <span class="k">上下文 ${fmt(s.in)}（未命中 ${fmt(s.miss)} · 缓存 ${cache}%）· 输出 ${fmt(s.out)}</span>
      ${s.content ? `<pre>${esc(s.content)}</pre>` : ''}${calls}</div>`;
  }
  if (s.kind === 'tool') {
    // ms_approx = 没有观测流，只能拿「模型发出调用 → 结果落盘」。并发批里这是偏大的
    // （含前一个工具的时间），所以标 ~ 而不是假装精确
    const dur = s.ms == null ? '' : `${s.ms_approx ? '~' : ''}${s.ms}ms`;
    return `<div class="step tool">
      <span class="k">tool</span> <span class="name">${esc(s.name)}</span>
      <span class="k">${esc(JSON.stringify(s.args))} ${dur}</span>
      ${s.is_error ? '<span class="pending">· 工具报错</span>' : ''}
      <pre>${esc(s.result)}</pre></div>`;
  }
  // 事件载荷在 s.data 里（不平铺，见 flow.py 的字段撞名注释）
  return `<div class="step event">
    <span class="k">事件</span> <span class="name">${esc(s.event)}</span>
    <span class="k">${esc(eventLine(s.event, s.data || {}))}</span>
    ${srcTag((eventSrc || {})[s.event])}</div>`;
}

function turnHTML(t, i, eventSrc) {
  const tools = t.steps.filter(s => s.kind === 'tool').length;
  const open = expanded.has(i) ? ' open' : '';
  // 分隔线只在**不是第一张卡**时画：starts_conversation 对首轮天然为真
  // （它确实开启了第一段对话），跳过 index 0 的判断放在渲染层（见 flow.py 的测试）
  const divider = (t.starts_conversation && i > 0)
    ? '<div class="divider">上下文已清空 · 新的一段对话</div>' : '';
  return divider + `<div class="turn${open}${t.unfinished ? ' unfinished' : ''}" data-i="${i}">
    <div class="head">
      <span class="num">#${i + 1}</span>
      <span class="q">${esc(t.user) || '<i>（无用户消息）</i>'}</span>
      <span class="stat">${t.steps.length} 步 · ${tools} 工具 · ${t.ms == null ? '—' : t.ms + 'ms'}
        · 上下文 ${fmt(t.context)} · 未命中 ${fmt(t.miss)} · 输出 ${fmt(t.tokens_out)}</span>
      ${t.unfinished ? '<span class="flag">未完成</span>' : ''}
    </div>
    <div class="body">${t.steps.map(s => stepHTML(s, eventSrc)).join('')}</div>
  </div>`;
}

async function loadFlow(name) {
  const q = name ? ('?session=' + encodeURIComponent(name)) : '';
  const d = await (await fetch('/api/flow' + q)).json();
  currentSession = d.session || '';
  const eventSrc = (lastData && lastData.event_src) || {};
  $('timeline').innerHTML = d.error
    ? `<div class="banner" style="display:block;background:#3b331d;border:1px solid var(--partial);color:#fde68a">${esc(d.error)}</div>`
    : (d.turns.length ? d.turns.map((t, i) => turnHTML(t, i, eventSrc)).join('')
                      : '<div class="stage">这个会话还没有回合</div>');
  const bits = [];
  if (!d.error) bits.push(d.turns.length + ' 个回合');
  if (d.has_events === false) bits.push('无 harness 事件（早于 feature 17 的会话）');
  if (d.skipped) bits.push('跳过 ' + d.skipped + ' 行坏数据');
  $('tl-meta').textContent = bits.join(' · ');
}

async function loadSessions() {
  const d = await (await fetch('/api/sessions')).json();
  const sel = $('sessions');
  const keep = sel.value;
  // value 用 id（`项目/文件名`）——跨项目列表里文件名可能撞（见 server 的 _resolve_session）。
  // 当前 cwd 的项目标 ●：`pai` 与 `pai-viz` 常不在同一目录起，得让人看出差别。
  sel.innerHTML = '<option value="">最新会话（跟着终端走）</option>'
    + d.sessions.map(s => `<option value="${esc(s.id)}">`
        + (s.current ? '● ' : '○ ') + esc(s.project) + ' / ' + esc(s.name)
        + (s.has_events ? ' ✦' : '') + '</option>').join('');
  if (keep) sel.value = keep;
}

function hot(id, cls, ms) {
  document.querySelectorAll(`[data-node="${id}"]`).forEach(el => {
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms);
  });
}

function playNext() {
  if (!animQueue.length) { playing = false; $('arch-status').innerHTML = ''; return; }
  playing = true;
  const rec = animQueue.shift();
  const kind = rec.event || rec.role || rec.type;
  (STAGE[kind] || []).forEach(id => hot(id, 'hot', 900));
  $('arch-status').innerHTML = `<span class="live-dot"></span>${esc(kind)}`;
  setTimeout(playNext, 600);     // 逐档播放：一次拉到 N 条就排队闪 N 下，不糊成一团
}

async function poll() {
  if (!$('live').checked) return;
  try {
    const picked = $('sessions').value;
    const params = new URLSearchParams();
    if (picked) params.set('session', picked);
    if (cursor != null) params.set('cursor', cursor);
    const d = await (await fetch('/api/events?' + params)).json();
    // 会话换了（新起了一次 pai）→ 整体重载。不比对的话页面会静默停更：
    // 旧游标对新文件不合法，server 只能重新对齐并返回 0 条（devlog T5 真跑发现）
    if (d.session && d.session !== currentSession) {
      cursor = d.cursor;
      await loadSessions();
      await loadFlow(picked);
      return;
    }
    if (cursor != null && d.records.length) {
      animQueue.push(...d.records);
      if (!playing) playNext();
      await loadFlow(picked);    // 时间线整体重拉：分组只有 Python 一份
    }
    cursor = d.cursor;
  } catch (e) { /* server 忙或没起来，下一拍再说 */ }
}

$('timeline').addEventListener('click', ev => {
  const tag = ev.target.closest('.src');
  if (tag) {
    const [file, line] = tag.dataset.src.split(':');
    fetch(`/api/reveal?path=${encodeURIComponent(file)}&line=${line || ''}`)
      .then(r => r.json())
      .then(d => { if (d.error) { $('error').textContent = d.error; $('error').style.display = 'block'; } });
    return;
  }
  const card = ev.target.closest('.turn');
  if (!card) return;
  const i = +card.dataset.i;
  card.classList.toggle('open');
  card.classList.contains('open') ? expanded.add(i) : expanded.delete(i);
});

$('pipeline').addEventListener('click', ev => {
  const tag = ev.target.closest('.src');
  if (!tag) return;
  ev.stopPropagation();
  fetch(`/api/reveal?path=${encodeURIComponent(tag.dataset.src)}`)
    .then(r => r.json())
    .then(d => { if (d.error) { $('error').textContent = d.error; $('error').style.display = 'block'; } });
});

$('sessions').addEventListener('change', async () => {
  cursor = null;                 // 换会话 = 重新对齐游标，不重放历史
  await loadFlow($('sessions').value);
});

loadSessions().then(() => loadFlow(''));
setInterval(poll, 2000);
</script>
</html>
