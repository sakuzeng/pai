[project]
name = "pai"
version = "0.1.0"
description = "A minimal coding agent harness, built from scratch in Python. Architecture informed by reading pi and Claude Code source."
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # 回放出图（pai-replay → PNG）是 e2e 的测量仪器，缺了它相关测试直接红（R4#26）
    "pillow>=10.0",
    # 并行跑测试（feature 30 拍板问 3·A）：`./test.sh -n auto` 可选加速，
    # 默认仍串行——「pty e2e 偶发挂死」旧账未确诊前不改默认，观察期记录见 TODO
    "pytest-xdist>=3.5",
]

[project.scripts]
pai = "pai.cli:main"
pai-viz = "pai.viz.server:main"
pai-replay = "pai.tui.replay:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: 需要真实 LLM API key 的测试（无 key 自动跳过）",
    "timeout_seconds: 这条测试的挂死预算（秒），默认 60；见 tests/pai_test_timeout.py",
]

[tool.setuptools.package-data]
"pai.viz" = ["*.html"]
